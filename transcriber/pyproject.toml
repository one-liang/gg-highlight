[project]
name = "gg-transcriber"
version = "0.1.0"
description = "gg-highlight speech-to-text CLI (faster-whisper), called by the Nuxt server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper>=1.2.1",
  # 4.6.3+ wheels are built without cuDNN (pure CUDA Conv1d); only cuBLAS 12 is needed on GPU.
  "ctranslate2>=4.6.3",
  # PyAV 19 removed av.open(metadata_errors=...), which faster-whisper 1.2.1 still passes.
  "av>=11,<19",
  # cublas64_12.dll / cublasLt64_12.dll for the CUDA path on Windows (see gg_transcriber/cuda_dlls.py).
  "nvidia-cublas-cu12>=12.8; sys_platform == 'win32'",
]

[project.scripts]
gg-transcribe = "gg_transcriber.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gg_transcriber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
